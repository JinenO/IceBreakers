<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="IRIS FLOW - Eye-tracking communication system for ALS patients" />
    <meta name="theme-color" content="#1a1d2e" />
    <title>IRIS FLOW - Eye Command System</title>
    <link rel="stylesheet" href="styles/main.css" />
    <link rel="stylesheet" href="styles/grid.css" />
    <link rel="stylesheet" href="styles/sos.css" />
    <link rel="stylesheet" href="styles/overlays.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
  </head>

  <body>
    <header id="status-bar" role="banner" aria-label="System Status">
      <div class="status-left">
        <div class="blink-indicator" id="eye-icon" role="status" aria-live="polite" aria-label="Eye tracking active"></div>
        <div class="status-text" id="status-text" role="status" aria-live="polite">SYSTEM READY</div>
      </div>
      <div class="status-right">
        <span class="caregiver-id" aria-label="Caregiver ID number">CAREGIVER ID: 9527</span>
        <button class="settings-trigger" aria-label="Open Settings" type="button">⚙️</button>
      </div>
    </header>

    <div id="content-area">
      <main id="main-grid" class="grid-container" role="main" aria-label="Communication Options"></main>

      <section id="view-container" class="hidden" role="region" aria-label="Sub-menu View">
        <div id="sub-grid" class="grid-container"></div>
      </section>
    </div>

    <footer id="sos-bar" role="alert" aria-label="Emergency SOS Trigger">
      <div class="sos-content">
        <div class="sos-icon" aria-hidden="true">
          <img src="assets/icons/sos.png" alt="SOS Icon" style="width: 48px; height: 48px" />
        </div>
        <div class="sos-text">
          <span class="sos-title">EMERGENCY SOS</span>
          <span class="sos-desc">CLOSE EYES FOR 2s TO TRIGGER</span>
        </div>
      </div>
      <div class="hazard-stripe" aria-hidden="true"></div>
    </footer>

    <div id="overlay-feedback" class="overlay" role="alert" aria-live="assertive" aria-label="Action confirmed">
      <div class="feedback-icon" aria-hidden="true">✅</div>
      <div class="feedback-text">SENT TO CAREGIVER</div>
    </div>

    <div id="overlay-pre-sos" class="overlay" role="alert" aria-live="assertive" aria-label="Emergency alert preparing">
      <div class="pre-sos-title">⚠️ PREPARING SOS ⚠️</div>
      <p class="overlay-sub">OPEN EYES NOW TO TRIGGER</p>
    </div>

    <div id="overlay-sos" class="overlay" role="alert" aria-live="assertive" aria-label="Emergency alert sent">
      <div class="sos-alert-box">
        <h1>🚨 SOS SENT 🚨</h1>
        <p>NOTIFYING EMERGENCY CONTACTS...</p>
      </div>
    </div>

    <div id="overlay-sleep" class="overlay" role="status" aria-live="polite" aria-label="System in standby mode">
      <div class="sleep-text">System Standby... Long Blink to Wake</div>
    </div>

    <div id="sos-overlay" class="sos-overlay">
      <div class="sos-text">EMERGENCY</div>
      <div class="sos-timer" id="sos-timer">3</div>
      <div class="sos-cancel-hint">CLOSE EYES TO CANCEL</div>
    </div>

    <script type="module" src="js/main.js"></script>
  </body>
</html>
